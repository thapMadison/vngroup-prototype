# Deploy riêng thư mục prototype site lên GitHub Pages
name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/prototypes/vuong-nhan/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Tắt Jekyll
        run: touch docs/prototypes/vuong-nhan/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/prototypes/vuong-nhan/site
      - id: deployment
        uses: actions/deploy-pages@v4
